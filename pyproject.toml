[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "citypulse"
version = "0.1.0"
description = "A modular Streamlit dashboard for a city's daily pulse."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "folium>=0.16,<1",
  "pandas>=2.2,<4",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "streamlit>=1.40,<2",
  "streamlit-folium>=0.24,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
warn_unreachable = true
